stages:
  - build
  - test
  - deliver
default:
  image: gcc
BuildCode:
  stage: build
  tags:
    - common
  before_script:
    - apt-get update
    - apt-get install -y cmake git
  script:
    - git clone https://github.com/google/googletest.git
    - cd googletest
    - mkdir build && cd build && cmake .. && make && make install
    - cd ../..
    - mkdir build && cd build 
    - cmake ..
    - make
    - ./bin/CTestExe
  artifacts:
    reports:
      junit: build/report.xml

TestCode:
  stage: test
  tags:
    - common
  before_script:
    - apt-get update
    - apt-get install -y cmake
  script:
    - mkdir build && cd build 
    - cmake .. 
    - make
    - cd ..
    - bin/CTestExe
  artifacts:
    reports:
      junit: build/report.xml

DeliverCode:
  stage: deliver
  tags:
    - common
  script:
    - cd build
    - cp bin/* /path/to/delivery/location/
