stages:
  - build
  - test
  - deliver

BuildCode:
  stage: build
  tags:
    - <указать тег для runner-а>
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make

TestCode:
  stage: test
  tags:
    - <указать тег для runner-а>
  script:
    - cd build
    - ./tests

DeliverCode:
  stage: deliver
  tags:
    - <указать тег для runner-а>
  script:
    - cd build
    - cp bin/* /path/to/delivery/location/
