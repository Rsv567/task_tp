stages:
  - build
  - test
  - deliver
default:
  image: registry.gitlab.akhcheck.ru/tp2024/registry/gcc:13
BuildCode:
  stage: build
  tags:
    - common
  script:
    - mkdir build
    - cd build
    - cmake ..
    - make

TestCode:
  stage: test
  tags:
    - common
  script:
    - cd build
    - ./tests

DeliverCode:
  stage: deliver
  tags:
    - common
  script:
    - cd build
    - cp bin/* /path/to/delivery/location/
